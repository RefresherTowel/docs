page:
  layout: default
  title: API Reference
  heading: API Reference
  parent: Echo
  nav_order: 2
  doc_version: current
  intro: Complete reference for Echo's logging, filtering, history, and tag APIs. For explanations and worked examples,
    start with the teaching pages; this page is for looking up exact capabilities.
function_sections:
- title: Functions
  subsections:
  - title: Logging
    functions:
    - EchoDebug
    - EchoDebugInfo
    - EchoDebugWarn
    - EchoDebugSevere
  - title: Debug level
    functions:
    - EchoDebugSetLevel
    - EchoDebugGetLevel
  - title: History and capture
    functions:
    - EchoDebugDumpLog
    - EchoDebugGetHistorySize
    - EchoDebugSetHistorySize
    - EchoDebugSetRawHistoryCapture
    - EchoDebugGetRawHistoryCapture
    - EchoDebugClearHistory
