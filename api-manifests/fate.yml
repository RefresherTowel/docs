    method_groups:
      Table setup:
        - GetTableId
        - SetStrictness
        - GetStrictness
        - AddEntry
        - AddValue
        - AddTable
        - AddFactory
        - GetEntries
      Policies:
        - AddPolicy
        - ClearPolicies
        - GetPolicies
        - EnablePity
        - EnableRateUp
        - EnableDuplicateProtection
        - EnableBatchGuarantee
        - EnableTenPullGuarantee
        - EnableShuffleBag
        - EnableStandardGachaRules
      Rolling and Preview:
        - Roll
        - Preview
      State and validation:
        - Validate
        - GetState
        - ValidateState
        - SetState

  FateEntry:
    require_grouping: true
    method_groups:
      Identity and availability:
        - SetKey
        - GetKey
        - GetStateType
        - SetEnabled
        - GetEnabled
      Selection rules:
        - SetWeight
        - GetWeight
        - SetGuaranteed
        - GetGuaranteed
        - SetGuaranteedPriority
        - GetGuaranteedPriority
        - SetUnique
        - GetUnique
        - SetUniqueKey
        - GetUniqueKey
      Resolution and callbacks:
        - SetResolver
        - SetOnSelected
        - SetOnRollFinished
        - ResolveForRoll
        - OnSelected
        - OnRollFinished
      State and Preview:
        - SetPreviewTransition
        - SetPreviewFinishTransition
        - GetState
        - SetState
        - GetPreviewState
        - CanAdvancePreviewState
        - AdvancePreviewState
        - CanFinishPreviewState
        - FinishPreviewState

  FateRollResult:
    method_groups:
      Status:
        - IsOk
        - GetError
        - IsComplete
        - IsPartial
        - IsEmpty
        - GetRequestedCount
        - GetSelectedCount
        - GetMissingCount
        - GetExhaustionReason
      Results:
        - GetEntries
        - GetValues
        - GetEntry
        - GetValue
      Details:
        - GetDiagnostics
        - GetSelectedEvents
        - GetTableSummaries
        - GetTableSummary

  FateSimulationChecks:
    method_groups:
      Entry metrics:
        - SetEntryMetricMin
        - SetEntryMetricMax
        - SetEntryMetricNear
        - SetFinalEntryMetricMin
        - SetFinalEntryMetricMax
        - SetFinalEntryMetricNear
      Table and exhaustion metrics:
        - SetTableMetricMin
        - SetTableMetricMax
        - SetTableMetricNear
        - SetRootExhaustionMax
        - SetAllTableExhaustionMax
      Determinism:
