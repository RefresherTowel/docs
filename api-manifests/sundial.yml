library:
  id: sundial
  name: Sundial
  symbol_prefix: Sundial
  macro_prefix: SUNDIAL_

source_globs:
  - scripts/scr_sundial/**/*.gml
  - scripts/scr_sundial_import/**/*.gml
  - scripts/scr_sundial_start/**/*.gml

require_public_coverage: true
require_macro_coverage: true

page:
  layout: default
  title: API Reference
  heading: API Reference
  parent: Sundial
  nav_order: 6
  doc_version: current
  intro: >-
    A list of Sundial's functions and settings, including what each argument does
    and what each function returns. If you're new to Sundial, the other pages
    walk you through using it in your game.

sections:
  - title: Sundial
    types:
      - Sundial

function_sections:
  - title: Starting, stopping and loading
    functions:
      - SundialStart
      - SundialStop
      - SundialImport

enum_sections:
  - title: Enums
    groups:
      - title: Grading colours
        enums:
          - eSundial
      - title: Time
        enums:
          - eSundialPeriod
          - eSundialPhase

macro_sections:
  - title: Version
    macros:
      - SUNDIAL_VERSION

types:
  Sundial:
    require_grouping: true
    method_groups:
      Grading:
        - SetGrading
        - SetGradingStrength
        - SetBrightness
      Indoor and outdoor:
        - SetIndoorGrading
        - SetIndoorGradingStrength
        - SetIndoorDaylightInfluence
        - SetIndoorBrightness
        - SetMask
        - SetMaskSprite
        - ClearMask
        - HasMask
        - GetMask
      Time and clock:
        - SetTimeOfDay
        - GetTimeOfDay
        - SetDayPercent
        - GetDayPercent
        - SetMorningTime
        - GetMorningTime
        - SetTime
        - GetTime
        - GetHour
        - GetMinute
        - SetCycleTiming
      Automatic time:
        - SetAutoTime
        - GetAutoTime
        - SetDayLength
        - GetDayLength
        - SetSpeed
        - GetSpeed
        - Update
      Periods and callbacks:
        - GetPeriod
        - OnPeriodChanged
        - OnPeriod
        - OnMorning
        - OnDay
        - OnAfternoon
        - OnDusk
        - OnNight
        - OnDawn
      Daylight and colour changes:
        - GetSunlightAmount
        - GetPhase
        - GetPhaseName
      Drawing and stopping:
        - Draw
        - CleanUp

enums:
  eSundial:
    description: The six parts of the day you can give their own colours and grading strengths.
    members:
      MORNING: Use this to change the Morning colour.
      DAY: Use this to change the Day colour.
      AFTERNOON: Use this to change the Afternoon colour.
      DUSK: Use this to change the Dusk colour, including sunset and twilight.
      NIGHT: Use this to change the Night colour.
      DAWN: Use this to change the Dawn colour, as night turns into Morning.
      NUM: The number of grading choices. It is not a part of the day.

  eSundialPeriod:
    description: The six parts of the day reported by GetPeriod() and used by functions such as OnMorning() and OnNight().
    members:
      MORNING: Morning, when Sundial's day begins.
      DAY: Daytime.
      AFTERNOON: Afternoon.
      DUSK: Dusk.
      NIGHT: Nighttime.
      DAWN: Dawn.
      NUM: The number of periods. Not a period itself.

  eSundialPhase:
    description: More detailed parts of the day used by Sundial's colour changes, including Sunset, Twilight and Predawn.
    members:
      MORNING: The Morning part of the colour changes.
      DAY: The Day part of the colour changes.
      AFTERNOON: The Afternoon part of the colour changes.
      SUNSET: Sunset, when the colours are moving towards Dusk.
      TWILIGHT: Twilight, between Dusk and Night.
      NIGHT: Nighttime.
      PREDAWN: The change from Night through Dawn and back to Morning.
      NUM: The number of phases. Not a phase itself.

symbols:
  SundialImport:
    example: |-
      sundial = SundialImport();

      // Or load one named preset.
      winter_sundial = SundialImport("Winter");
    see_also:
      - Sundial

  Sundial.Draw:
    example: |-
      // In Post Draw, colour grade your game.
      sundial.Draw();

      // Or draw your own surface at a chosen position and size.
      sundial.Draw(my_surface, 0, 0, 1280, 720);

  Sundial.SetMask:
    see_also:
      - Sundial.SetMaskSprite
      - Sundial.ClearMask
      - Sundial.HasMask
      - Sundial.GetMask

  Sundial.SetMaskSprite:
    see_also:
      - Sundial.SetMask
      - Sundial.ClearMask
      - Sundial.HasMask
      - Sundial.GetMask

  Sundial.CleanUp:
    see_also:
      - Sundial.Draw
      - SundialStart
      - SundialStop

  SundialStart:
    example: |-
      sundial = SundialStart();
      sundial.SetDayLength(600);
    see_also:
      - SundialStop
      - SundialImport
      - Sundial.CleanUp

  SundialStop:
    example: |-
      SundialStop();
    see_also:
      - SundialStart
      - Sundial.CleanUp

  Sundial.SetTime:
    example: |-
      sundial.SetTime(18.5); // 18:30
    see_also:
      - Sundial.GetTime
      - Sundial.SetMorningTime
      - Sundial.SetTimeOfDay

  Sundial.OnPeriodChanged:
    example: |-
      sundial.OnPeriodChanged(function(_from, _to) {
          global.current_period = _to;
      });
    see_also:
      - Sundial.OnPeriod
      - eSundialPeriod
