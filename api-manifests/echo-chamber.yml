enums:
  eEchoChamberDock:
    description: Chooses how a panel claims space from its parent. Echo Chamber lays out `TOP`, `BOTTOM`, `LEFT`,
      and `RIGHT` edge strips first, then gives `FILL` whatever space remains. Panels that use the same dock direction
      are handled in their added order.
  eEchoChamberChromeButtonSlot:
    description: Identifies which title-bar button on a window you want to style or address.
  eEchoChamberChromeIcon:
    description: Names the built-in icon meaning used by window title-bar buttons.
  eEchoChamberChromeIconState:
    description: Describes the current visual state of a title-bar icon so a style can provide different visuals
      for normal, hovered, pressed, or disabled states.
  eEchoChamberChromeIconVisualKind:
    description: 'Chooses how a title-bar icon is represented: not drawn, drawn from a sprite, drawn from Echo Chamber''s
      built-in buffer, or drawn as text.'
  eEchoChamberCollapse:
    description: Controls whether a panel can collapse and, when it can, which edge it collapses toward.
  eEchoChamberPanelSizeMode:
    description: Chooses whether a docked panel uses an explicit thickness (`FIXED`) or sizes that thickness from
      its contents (`FIT_CONTENT`). For top/bottom panels the thickness is height, while for left/right panels it's
      width.
  eEchoChamberPanelFlow:
    description: Chooses how a panel arranges its direct controls. `ROW` packs controls across rows and can wrap,
      while `COLUMN` stacks them vertically.
  eEchoChamberPanelRowAlign:
    description: When a packed row doesn't use the full available width, chooses whether that row sits at the start,
      centre, or end.
  eEchoChamberPanelRowDistribution:
    description: Controls horizontal space inside packed rows. `PACK` keeps controls at their desired widths, while
      `FILL` distributes available row width to controls that are allowed to fill.
  eEchoChamberAlignHor:
    description: General left/centre/right alignment used by layouts, popups, and styles.
  eEchoChamberAlignVer:
    description: General top/middle/bottom alignment used by layouts and styles.
  eEchoChamberBoxShape:
    description: Chooses the shape drawn by style surfaces that support rectangular or rounded boxes.
    members:
      NUM: Enum sentinel. Use RECTANGLE or ROUNDRECT for style SetShape() calls.
  eEchoChamberLabelPlacement:
    description: Chooses where a control's separate form label is drawn. `LEADING` places it beside the control,
      `ABOVE` puts it above, `NONE` hides it, and `AUTO` lets the panel/style choose based on available room.
  eEchoChamberLabelAlign:
    description: Chooses the horizontal alignment of label text. `AUTO` leaves the choice to the active label style
      and placement rules.
  eEchoChamberPopupDirection:
    description: Chooses whether an anchored popup prefers to open below or above its anchor, or lets Echo Chamber
      choose from the available space.
  eEchoChamberColorPopupVisualSpace:
    description: Chooses whether the colour picker presents its colour controls in HSV or HSL space.
  eEchoChamberColorButtonValueTextMode:
    description: Chooses whether a colour button also prints the current RGB value as text.
  eEchoChamberSliderValuePosition:
    description: Chooses whether a slider's displayed value text appears above or below the slider body.
  eEchoChamberValidationKind:
    description: Describes how serious a validation message is when a text control reports a problem or informational
      note.
  eEchoChamberValidationDisplay:
    description: Chooses whether validation feedback is shown inline, as a tooltip, or chosen automatically.
  eEchoChamberSeparatorOrientation:
    description: Chooses whether a separator control draws horizontally or vertically.
  eEchoChamberBindingKind:
    description: Internal storage mode used by dynamic control bindings. Configure bindings with the relevant Bind*()
      method instead of assigning this enum directly.
  eEchoChamberInputCheck:
    description: 'Chooses which moment of a key/input action counts: the first press, every frame it''s held, or
      the release.'
  eEchoChamberInputBindKind:
    description: Describes whether a named Echo Chamber action is connected to a keyboard key, a custom function,
      or deliberately blocked from parent-context fallback.
  eEchoChamberDebugTheme:
    description: Chooses the dedicated visual theme used by Echo Console and the other built-in debugger windows.
  eEchoChamberDebugTargetKind:
    description: Tells the debugger what kind of value is currently selected as its shared target, such as a live
      instance, struct, global scope, asset, or log entry.
  eEchoConsoleDsKind:
    description: Lists the GameMaker DS types the Data Structure Scanner knows how to inspect.
  eEchoConsoleCommandArgType:
    description: Tells the Console command parser how to turn one typed argument into a GML value. `TEXT` consumes
      the rest of the command line and is useful for values containing spaces.
  eEchoConsoleCommandCallbackKind:
    description: Describes whether a registered command callback receives raw command text or arguments that Echo
      Console has already parsed.
  eEchoChamberDebugPickMode:
    description: Describes whether the debugger is currently waiting for the user to click a live instance in the
      game.
  eEchoChamberWatchKind:
    description: 'Describes where a watch gets the value it keeps visible: one instance field, one global field,
      or a callback that calculates the value.'
