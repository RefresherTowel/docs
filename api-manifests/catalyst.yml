    see_also:
      - CatalystEffect
      - CatalystEffectApplicationResult
      - label: Effects
        href: /catalyst/effects

  CatalystSet.Preview:
    see_also:
      - CatalystSetPreviewResult
      - CatalystSet.Apply
      - label: Sets & Previews
        href: /catalyst/sets-and-previews

  CatalystSet.PreviewSwap:
    see_also:
      - CatalystSetPreviewResult
      - CatalystSet.ApplySwap
      - label: Sets & Previews
        href: /catalyst/sets-and-previews

  CatalystSet.Apply:
    see_also:
      - CatalystSetApplyResult
      - CatalystSet.Preview

  CatalystSet.ApplySwap:
    see_also:
      - CatalystSetApplyResult
      - CatalystSet.PreviewSwap

  CatalystSet.CaptureState:
    see_also:
      - CatalystStateCaptureResult
      - CatalystSet.RestoreState
      - label: Saving & Loading
        href: /catalyst/saving-and-loading

  CatalystSet.RestoreState:
    see_also:
      - CatalystStateRestoreResult
      - CatalystRepair
      - CatalystSet.CaptureState
      - label: Saving & Loading
        href: /catalyst/saving-and-loading

  CatalystStateCaptureResult.GetReport:
    fields:
      - name: report_version
        type: Real
        description: Version of the diagnostic report format.
      - name: success
        type: Bool
        description: Whether capture succeeded.
      - name: stage
        type: String
        description: Capture stage represented by this report.
      - name: failures
        type: Array<Struct>
        description: Plain-data descriptions of values Catalyst could not capture.
      - name: set_identity
        type: String,Real,Undefined
        description: Set identity when one was available.

  CatalystStateRestoreResult.GetReport:
    fields:
      - name: report_version
        type: Real
        description: Version of the diagnostic report format.
      - name: success
        type: Bool
        description: Whether the prepared state has been completely applied.
      - name: stage
        type: String
        description: Current restore stage, such as prepare, pending, ready, apply, or complete.
      - name: salvaged
        type: Bool
        description: Whether temporary saved values were deliberately ignored so the restore could proceed.
      - name: failures
        type: Array<Struct>
        description: Plain-data descriptions of unresolved or failed restore requirements.
      - name: ignored
        type: Array<Struct>
        description: Temporary saved values deliberately skipped by the restore.
      - name: set_identity
        type: String,Real,Undefined
        description: Live Set identity when available.
      - name: saved_set_identity
        type: String,Real,Undefined
        description: Identity stored in the captured state when available.
